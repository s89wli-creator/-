name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_URL: postgres://rakan_app:rakan_app_ci@localhost:5432/rakan
  MIGRATION_DATABASE_URL: postgres://rakan_owner:rakan_owner_ci@localhost:5432/rakan

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: "Lint (includes architecture rule: DB access only via DbService)"
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      - name: Create roles, database and run migrations
        run: pnpm db:setup

      - name: Unit + integration + RLS + tenant isolation tests
        run: pnpm test
      - name: Tenant isolation with RLS bypassed (application layer must isolate on its own)
        run: pnpm test:isolation:app-layer

      - name: Build
        run: pnpm build

      - name: Browser end-to-end (foundation, sales cycle, UX, AI, security and offline field app, platform console - Arabic RTL, phone + desktop)
        run: |
          pnpm exec playwright install --with-deps chromium
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs CASCADE"
          (cd apps/api && NODE_ENV=test MAIL_TRANSPORT=log LOG_LEVEL=info node dist/main.js > /tmp/api-e2e.log 2>&1 &)
          (cd apps/web && pnpm start > /tmp/web-e2e.log 2>&1 &)
          npx wait-on@8.0.4 -t 60000 http://localhost:4000/api/health http://localhost:3000/login
          E2E_MAIL_LOG=/tmp/api-e2e.log pnpm e2e
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs CASCADE"
          E2E_MAIL_LOG=/tmp/api-e2e.log pnpm e2e:crm
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs CASCADE"
          pnpm e2e:ux
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs CASCADE"
          E2E_MAIL_LOG=/tmp/api-e2e.log pnpm e2e:ai
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs CASCADE"
          pnpm e2e:field
          psql "$MIGRATION_DATABASE_URL" -c "TRUNCATE users, tenants, sessions, password_reset_tokens, audit_logs, platform_audit CASCADE"
          pnpm e2e:platform
      - name: Upload E2E screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots
            /tmp/api-e2e.log
            /tmp/web-e2e.log
          if-no-files-found: ignore
